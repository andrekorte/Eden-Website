name: Update Facebook feed

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest posts
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: node scripts/fetch-facebook-posts.js

      - name: Commit changes
        run: |
          git config user.name "facebook-feed-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data
          git diff --cached --quiet || git commit -m "Update Facebook feed"
          git push
